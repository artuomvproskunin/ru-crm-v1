# kubectl apply -k deploy/k8s/app
#
# Secrets are NOT managed here (never commit them) — create them once by
# hand, see deploy/k8s/README.md:
#   ghcr-pull  — docker-registry secret for the private GHCR image
#   crm-env    — runtime env (keys listed in env.example)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: salesdaily
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - cronjob.yaml
images:
  - name: ghcr.io/artuomvproskunin/ru-crm-v1
    # Deploy an immutable dev-sha-<commit> tag from the docker-image workflow:
    #   cd deploy/k8s/app && kustomize edit set image \
    #     ghcr.io/artuomvproskunin/ru-crm-v1=ghcr.io/artuomvproskunin/ru-crm-v1:dev-sha-<short>
    newTag: dev-design
