# Let's Encrypt issuers for cert-manager (HTTP-01 via Traefik).
#
#   kubectl apply -f deploy/k8s/infra/cluster-issuer.yaml
#
# Ingresses opt in with the annotation
#   cert-manager.io/cluster-issuer: letsencrypt-prod
# HTTP-01 needs the host's DNS to point at the Traefik LoadBalancer and
# port 80 reachable from the internet.
#
# `letsencrypt-staging` issues untrusted test certs with generous rate
# limits — switch an Ingress to it while debugging issuance, so failed
# attempts don't burn the production limits.
#
# ⚠ Set `email` before applying: Let's Encrypt sends expiry warnings there.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: bfedotov@in4comgroup.com
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: bfedotov@in4comgroup.com
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
