# Build the Next.js standalone image (see Dockerfile) and push it to GHCR.
#
# Tags pushed:
#   ghcr.io/<owner>/<repo>:dev-sha-<short>  — every build (immutable; deploy THIS)
#   ghcr.io/<owner>/<repo>:dev-<branch>     — moving tag per branch
#
# The `dev-` prefix matters: NEXT_PUBLIC_* are baked in at build time, so a
# dev image (dev.salesdaily.ru) must never be deployed to prod.
#
# Settings → Environments → dev → Environment variables:
#   NEXT_PUBLIC_APP_URL         (required — dev: https://dev.salesdaily.ru, prod: https://salesdaily.ru)
#   NEXT_PUBLIC_PRODUCTION_URL  (optional)
# NEXT_PUBLIC_* are baked into the client bundle at build time — changing
# them means a rebuild, not a pod restart. No secrets are needed here:
# runtime secrets come from the Kubernetes Secret.

name: docker-image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # NEXT_PUBLIC_* live in the GitHub Environment `dev` (Settings →
    # Environments), not as repository variables.
    environment: dev
    steps:
      # Private-repo runners have ~7 GB RAM; `next build` peaks near that.
      # Extra swap turns an OOM kill into a slower build.
      - name: Add swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - uses: actions/checkout@v4

      - name: Check build variables
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_APP_URL" ]; then
            echo "::error::Variable NEXT_PUBLIC_APP_URL is not set in GitHub Environment dev"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=dev-sha-
            type=ref,event=branch,prefix=dev-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_PRODUCTION_URL=${{ vars.NEXT_PUBLIC_PRODUCTION_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
